name: Warm Ollama model

# Vercel Hobby plan cron jobs only run once a day, too infrequent to keep the
# Ollama model loaded. This runs on GitHub's free scheduler instead.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/warm
        run: curl -sf --max-time 30 "${{ vars.APP_URL }}/api/warm"
